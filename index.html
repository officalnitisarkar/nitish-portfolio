<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B14">
<title>Nitish Sarkar | Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* ===== STEP A: RANG (colors) yahan badlo ===== */
:root{--bg:#0E0B14;--panel:#1A1524;--ink:#F3EFF7;--mute:#A79DB8;--red:#E50914;--line:#352c46}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0)}
.d{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.02em;line-height:.92}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn{display:inline-block;padding:.75rem 1.5rem;border-radius:6px;border:0;font:700 16px "DM Sans",sans-serif;cursor:pointer;color:#fff}
.w{background:#fff;color:#000}.g{background:rgba(255,255,255,.18)}.r{background:var(--red)}

/* ===== Who's watching ===== */
#who{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px;text-align:center;transition:opacity .5s}
#who.off{opacity:0;pointer-events:none}
#who h2{font-size:clamp(44px,9vw,76px);margin:0}
.pfs{display:flex;gap:clamp(12px,3vw,28px);flex-wrap:wrap;justify-content:center}
.pf{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;width:clamp(78px,20vw,120px)}
.pf i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:8px;border:3px solid transparent;font:400 44px "Bebas Neue";font-style:normal;color:#fff;margin-bottom:8px;background-size:cover;background-position:center top;transition:transform .2s}
.pf:hover,.pf:focus-visible{color:#fff}
.pf:hover i,.pf:focus-visible i{border-color:#fff;transform:scale(1.07)}

/* ===== Menu ===== */
nav#bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 4% 10px;background:linear-gradient(#0E0B14,transparent);transition:background .3s}
nav#bar.s{background:var(--bg)}
.logo{font-size:34px;color:var(--red)}
.links{display:flex;gap:16px;font-size:14px;color:var(--mute);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.links a:hover{color:#fff}

/* ===== HERO: 3D video + 3D name ===== */
#hero{position:relative;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:6.5rem 6% 4rem;background:radial-gradient(900px 600px at 80% 25%,rgba(229,9,20,.12),transparent 60%),radial-gradient(600px 500px at 5% 95%,rgba(80,60,160,.35),transparent 60%)}
#hero:after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(14,11,20,.45),rgba(14,11,20,.05) 30%,rgba(14,11,20,.55) 62%,rgba(14,11,20,.95));pointer-events:none}
#stage{position:absolute;inset:0;z-index:1;perspective:900px;overflow:hidden}
#hv{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 50%;background:#0E0B14;transform:rotateX(var(--px,0deg)) rotateY(var(--py,0deg));will-change:transform}
#hero .in{position:relative;z-index:3;perspective:900px}
#greet{color:var(--red);font-weight:700;margin:0 0 10px}
#name{margin:0;font-size:clamp(4.3rem,23vw,11rem);color:#fff;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));text-shadow:var(--ext,none);will-change:transform}
#name span{display:block}
.sub{color:#e2dbee;max-width:430px;margin:20px 0 0;text-shadow:0 1px 8px #000}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

/* ===== Sections ===== */
section{padding-top:30px}
h2.t{font-size:clamp(30px,5vw,44px);margin:0 4% 8px}
.track{display:flex;gap:12px;overflow-x:auto;padding:14px 4% 24px;scroll-snap-type:x proximity}
.tile{flex:0 0 auto;border-radius:8px;scroll-snap-align:start;transition:transform .25s;color:#fff}
.tile:hover,.tile:focus-visible{transform:scale(1.06)}
.ex{width:clamp(170px,42vw,240px);height:120px;padding:14px;display:flex;align-items:flex-end;font:400 28px/1 "Bebas Neue"}
.pj{width:clamp(220px,62vw,290px);min-height:180px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;border:0;text-align:left;font:inherit;cursor:pointer}
.pj b{font:400 28px/1 "Bebas Neue";letter-spacing:.5px}
.pj span{font-size:13px;color:#e6e0ee;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#about{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:56px 4% 0;align-items:start}
#about h2{margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.meta span{border:1px solid #5a4f70;padding:1px 10px;font-size:13px;color:#ddd;border-radius:3px}
#about p{color:var(--mute);max-width:520px;margin:0 0 12px}
.chips{padding:10px 4%;display:flex;flex-wrap:wrap;gap:10px;max-width:900px}
.chip{position:relative;overflow:hidden;isolation:isolate;cursor:pointer;-webkit-tap-highlight-color:transparent;background:var(--panel);border-bottom:3px solid var(--red);padding:12px 20px;border-radius:10px;font-weight:700;transition:transform .2s,border-color .4s,box-shadow .4s}
.chip:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,hsl(var(--h) 90% 58%),hsl(calc(var(--h) + 40) 85% 42%));clip-path:circle(0% at var(--x,50%) var(--y,50%));transition:clip-path .65s cubic-bezier(.2,.8,.2,1)}
.chip.on:before{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
.chip.on{border-color:hsl(var(--h) 90% 70%);box-shadow:0 8px 24px hsl(var(--h) 90% 50% / .35);color:#fff}
.chip:active{transform:scale(.94)}
.tl{margin:20px 4%;border-left:2px solid var(--red);padding-left:22px;display:grid;gap:22px;max-width:760px}
.tl div{position:relative}
.tl div:before{content:"";position:absolute;left:-29px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red)}
.tl em{font:400 22px "Bebas Neue";font-style:normal;color:var(--red);letter-spacing:1px}
.tl b{display:block;font-size:18px}.tl span{color:var(--mute)}
.stage{padding:14px 4%;max-width:420px}
.stage video{width:100%;border-radius:10px;background:#000;max-height:70svh}
.hint{color:var(--mute);font-size:14px}
#end{text-align:center;padding:110px 6% 80px}
#end h2{font-size:clamp(3rem,13vw,8rem);margin:0}
footer{text-align:center;color:#6c6380;font-size:13px;padding:0 0 30px}

/* ===== Popup ===== */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:1.25rem}
#box{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:82svh;overflow:auto;padding:1.75rem}
#box h2{font-size:38px;margin:0 0 12px}
#box p{color:var(--mute);margin:0 0 10px}

@media(max-width:760px){#about{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tile{transition:none}}
/* ===== 360 RING CARDS (pro look) ===== */
.ring{position:relative;display:block;overflow:visible!important;perspective:1200px;padding:0!important;margin:0;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.ring:active{cursor:grabbing}
.ring:after{content:"\25C0   SWIPE   \25B6";position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 10px "DM Sans",sans-serif;letter-spacing:.3em;color:var(--mute);opacity:.7;pointer-events:none}
.spin{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.ring .tile{position:absolute;left:0;top:0;border-radius:20px;transition:none;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2);overflow:hidden;will-change:transform}
.ring .ex{width:210px;height:128px;padding:18px;align-items:flex-end;justify-content:space-between;text-align:left;font-size:30px}
.ring .ex:after{content:"\2192";font:400 26px "DM Sans",sans-serif;opacity:.85}
.ring .pj{width:240px;height:290px;min-height:0;padding:22px;align-items:flex-start;justify-content:flex-end;text-align:left;gap:6px}
.ring .pj:before{content:attr(data-n);position:absolute;top:14px;left:20px;font:400 52px/1 "Bebas Neue";color:rgba(255,255,255,.2)}
.ring .pj:after{content:"View details \2192";margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.04em;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);width:100%}
.ring .pj b{font-size:30px;line-height:.95}
.ring .pj span{font-size:13px;line-height:1.45;-webkit-line-clamp:4}
/* ===== LIGHTING (dark red + black, halka) ===== */
#amb{position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,rgba(150,8,18,.14),transparent 70%),radial-gradient(35% 30% at 80% 70%,rgba(120,6,16,.12),transparent 70%),radial-gradient(30% 30% at 55% 105%,rgba(80,4,12,.3),transparent 70%);animation:amb 16s ease-in-out infinite alternate}
@keyframes amb{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,3%,0) scale(1.1)}}
#vig{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.88))}
.ring .tile .sheen{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;border-radius:inherit;background:radial-gradient(170px circle at var(--mx,50%) var(--my,50%),rgba(255,50,60,.2),rgba(110,0,10,.22) 50%,transparent 75%)}
.ring .tile.lit{border-color:rgba(190,15,28,.75);box-shadow:0 0 0 1px rgba(160,10,22,.6),0 0 22px rgba(150,8,18,.4),0 22px 50px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.12)}
.ring .tile.lit .sheen{opacity:1}
.burst{position:fixed;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;z-index:54;pointer-events:none;border-radius:42% 58% 61% 39%/45% 38% 62% 55%;background:radial-gradient(circle,rgba(255,45,55,.55) 0,rgba(170,8,20,.5) 38%,transparent 72%);animation:burst .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes burst{0%{transform:translate(var(--x),var(--y)) scale(.2) rotate(0);opacity:1}60%{opacity:.7;border-radius:58% 42% 39% 61%/55% 62% 38% 45%}100%{transform:translate(var(--x),var(--y)) scale(2.6) rotate(40deg);opacity:0}}
.spark{position:fixed;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;z-index:54;pointer-events:none;background:#d4121f;box-shadow:0 0 8px 2px rgba(200,10,25,.8);animation:spark .8s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:.9}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(.2);opacity:0}}
@media(prefers-reduced-motion:reduce){#amb{animation:none}}
/* ===== text ke niche halka red ===== */
h2.t{padding-bottom:12px;background:linear-gradient(90deg,rgba(229,9,20,.8),rgba(229,9,20,.25) 55%,transparent) left bottom/78px 3px no-repeat;filter:drop-shadow(0 8px 14px rgba(229,9,20,.25))}
#about p{padding-bottom:8px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(229,9,20,.28),transparent 70%) 1}
.tl div b{display:block;width:fit-content;padding-bottom:3px;background:linear-gradient(90deg,rgba(229,9,20,.6),transparent) left bottom/60% 2px no-repeat}
</style>
</head>

<script>
/* ============================================================

const D={

/* ============ Neeche ka code: apne aap sab bhar deta hai ============ */
const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.title=D.name.join(" ")+" | Portfolio";
$("name").innerHTML=D.name.map(w=>"<span>"+E(w)+"</span>").join("");
$("tag").textContent=D.tagline;
$("meta").innerHTML=[D.role,D.college].map(m=>"<span>"+E(m)+"</span>").join("");
$("aboutText").innerHTML=D.about.map(p=>"<p>"+E(p)+"</p>").join("");
$("talk").href=D.insta;
$("yr").textContent=new Date().getFullYear();$("fn").textContent=D.name.join(" ");
const tiles=[["Projects","#projects","#E50914,#2a0a12"],["Skills","#skills","#2FB67C,#0E4030"],["Journey","#journey","#F2B531,#4a3306"]];
$("ex").innerHTML=tiles.map(t=>'<a class="tile ex" href="'+t[1]+'" style="background:linear-gradient(135deg,'+t[2]+')">'+t[0]+"</a>").join("");
$("ptrack").innerHTML=D.projects.map((p,i)=>'<button class="tile pj" data-p="'+i+'" style="background:linear-gradient(160deg,'+p[2]+',#0E0B14)"><b>'+E(p[0])+"</b><span>"+E(p[1])+"</span></button>").join("");
if(D.achievements.length){$("achv").hidden=false;$("atrack").innerHTML=D.achievements.map((a,i)=>'<button class="tile pj" data-a="'+i+'" style="background:linear-gradient(160deg,#8a6d1f,#0E0B14)"><b>'+E(a[0])+"</b><span>"+E(a[1]||"")+"</span></button>").join("")}
$("chips").innerHTML=D.skills.map(s=>'<span class="chip">'+E(s)+"</span>").join("");

/* ===== 360 RING: drag se ghumao ===== */
function ring(id,w,h,R){
  const t=$(id),cards=[...t.children],n=cards.length;if(!n)return;
  const spin=document.createElement("div");spin.className="spin";
  cards.forEach((c,i)=>{c.style.margin=(-h/2)+"px 0 0 "+(-w/2)+"px";c.dataset.n=("0"+(i+1)).slice(-2);spin.appendChild(c)});
  t.textContent="";t.appendChild(spin);t.classList.add("ring");
  t.style.height=(h+36)+"px";
  let a=0,v=0,dir=-1,drag=false,moved=0,lx=0;
  const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const set=()=>{
    cards.forEach((c,i)=>{
      const p=(((360/n*i+a)%360)+540)%360-180,r=p*Math.PI/180;
      const f=(1+Math.cos(r))/2;
      c.style.transform="translate3d("+(R*Math.sin(r)).toFixed(1)+"px,0,"+(-(1-Math.cos(r))*R*.6).toFixed(1)+"px) rotateY("+(-Math.sin(r)*38).toFixed(1)+"deg) scale("+(.72+.28*f).toFixed(3)+")";
      c.style.opacity=(.4+.6*f).toFixed(2);
      c.style.zIndex=Math.round(f*100);
    });
  };
  t.addEventListener("pointerdown",e=>{drag=true;moved=0;lx=e.clientX;v=0});
  addEventListener("pointermove",e=>{
    if(!drag)return;
    const dx=e.clientX-lx;lx=e.clientX;
    moved+=Math.abs(dx);a+=dx*.45;v=dx*.45;
    if(dx)dir=dx>0?1:-1;
    set();
  });
  addEventListener("pointerup",()=>{drag=false});
  addEventListener("pointercancel",()=>{drag=false});
  t.addEventListener("click",e=>{if(moved>8){e.preventDefault();e.stopPropagation();moved=0}},true);
  (function loop(){
    if(!drag){
      if(Math.abs(v)>.05){a+=v;v*=.95}
      else if(!calm)a+=dir*.2;
      set();
    }
    requestAnimationFrame(loop);
  })();
}
ring("ex",210,128,190);
ring("ptrack",240,290,170);

/* ===== SKILLS: tap karo to rang bhar jaye ===== */
$("chips").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;
  const r=c.getBoundingClientRect();
  c.style.setProperty("--x",(e.clientX-r.left)+"px");
  c.style.setProperty("--y",(e.clientY-r.top)+"px");
  c.classList.toggle("on");
});
$("chips").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const c=e.target.closest(".chip");if(!c)return;
  e.preventDefault();c.classList.toggle("on");
});

/* ===== LIGHTING: dark red glow + tap par lights alag ho jayein ===== */
(function(){
  const b=document.body,calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const mk=id=>{const d=document.createElement("div");d.id=id;b.appendChild(d);return d};
  mk("amb");mk("vig");
  document.querySelectorAll(".ring .tile").forEach(t=>{const i=document.createElement("i");i.className="sheen";t.insertBefore(i,t.firstChild)});
  let cur=null,hide=0;
  function spot(x,y,el){
    const t=el&&el.closest?el.closest(".ring .tile"):null;
    if(t!==cur){if(cur)cur.classList.remove("lit");cur=t;if(t)t.classList.add("lit")}
    if(t){const r=t.getBoundingClientRect();
      t.style.setProperty("--mx",((x-r.left)/r.width*100)+"%");
      t.style.setProperty("--my",((y-r.top)/r.height*100)+"%")}
  }
  function burst(x,y){
    const add=(c,st)=>{const d=document.createElement("div");d.className=c;
      for(const k in st)d.style.setProperty(k,st[k]);b.appendChild(d);setTimeout(()=>d.remove(),1000)};
    add("burst",{"--x":x+"px","--y":y+"px"});
    for(let i=0;i<5;i++){
      const ang=Math.random()*Math.PI*2,d=50+Math.random()*80;
      add("spark",{"--x":x+"px","--y":y+"px","--dx":(Math.cos(ang)*d).toFixed(0)+"px","--dy":(Math.sin(ang)*d).toFixed(0)+"px"});
    }
  }
  addEventListener("pointermove",e=>{clearTimeout(hide);spot(e.clientX,e.clientY,e.target)},{passive:true});
  addEventListener("pointerdown",e=>{clearTimeout(hide);spot(e.clientX,e.clientY,e.target);if(!calm&&!(e.target.closest&&e.target.closest("#hero")))burst(e.clientX,e.clientY)},{passive:true});
  addEventListener("pointerup",e=>{
    if(e.pointerType==="mouse")return;
    hide=setTimeout(()=>{if(cur){cur.classList.remove("lit");cur=null}},900);
  });
})();

/* Popup */
const modal=$("modal");
function openM(t,h){$("mt").textContent=t;$("mb").innerHTML=h;modal.style.display="flex";$("x").focus()}
function closeM(){modal.style.display="none"}
$("x").onclick=closeM;modal.onclick=e=>{if(e.target===modal)closeM()};
addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-p],[data-a]");if(!b)return;
  const p=b.dataset.p!==undefined?D.projects[b.dataset.p]:D.achievements[b.dataset.a];
  openM(p[0],"<p>"+E(p[1]||"")+"</p>");
});

/* Who's watching */
$("pfs").innerHTML=D.profiles.map((p,i)=>{
  const st=p[2]==="photo"?"background-image:url(photo.jpg);background-color:#E50914":"background-color:"+p[2];
  return '<button class="pf" data-i="'+i+'"><i style="'+st+'">'+(p[2]==="photo"?"":E(p[0][0]))+"</i>"+E(p[0])+"</button>";
}).join("");
$("pfs").onclick=e=>{
  const b=e.target.closest(".pf");if(!b)return;
  const p=D.profiles[b.dataset.i];
  $("greet").textContent="WELCOME, "+p[0].toUpperCase();
  $("who").classList.add("off");
  if(p[1]!=="top")setTimeout(()=>{location.hash="#"+p[1]},450);
};

/* Menu background on scroll */
addEventListener("scroll",()=>$("bar").classList.toggle("s",scrollY>40),{passive:true});

/* Showreel video na mile to hint dikhao */
if($("rv"))$("rv").addEventListener("error",()=>{if($("reelBox"))$("reelBox").innerHTML=""});

/* ===== 3D NAAM: touch / mouse / phone-tilt se ghoomta hai ===== */
const name3d=$("name"),photo=$("hv"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let tx=0,ty=0,gx=0,gy=0,t0=0,user=false;
function depth(x,y){
  let s="";
  for(let i=1;i<=14;i++)s+=(x*i*1.1).toFixed(1)+"px "+(y*i*1.1).toFixed(1)+"px 0 hsl(352 18% "+(30-i*1.7)+"%),";
  return s+"0 28px 60px rgba(0,0,0,.6),0 0 60px rgba(229,9,20,.08)";
}
function aim(nx,ny){gx=Math.max(-1,Math.min(1,nx));gy=Math.max(-1,Math.min(1,ny));user=true}
addEventListener("pointermove",e=>aim((e.clientX/innerWidth-.5)*2,(e.clientY/innerHeight-.5)*2),{passive:true});
addEventListener("deviceorientation",e=>{if(e.gamma==null)return;aim(e.gamma/25,(e.beta-50)/25)},{passive:true});
function frame(t){
  if(!user){gx=Math.sin(t/1400)*.7;gy=Math.cos(t/1900)*.3}
  tx+=(gx-tx)*.08;ty+=(gy-ty)*.08;
  name3d.style.setProperty("--ry",(tx*16)+"deg");
  name3d.style.setProperty("--rx",(-ty*10)+"deg");
  name3d.style.setProperty("--ext",depth(-tx*1.4,-ty*1.4+1.2));
  photo.style.setProperty("--py",(tx*10)+"deg");
  photo.style.setProperty("--px",(-ty*7)+"deg");
  if(!still)requestAnimationFrame(frame);
}
if(still){gx=.4;gy=0;tx=.4;frame(0)}else requestAnimationFrame(frame);
</script>
